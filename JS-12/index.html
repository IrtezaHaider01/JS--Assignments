<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="sky-clear-day">
  <main class="app">
    <header class="topbar">
      <form id="search-form" class="search" role="search" autocomplete="off">
        <label for="city-input" class="sr-only">Search for a city</label>
        <input id="city-input" type="search" placeholder="Search city, e.g. Karachi" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" spellcheck="false">
        <button type="submit" class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </form>

      <div class="unit-toggle" role="group" aria-label="Units">
        <button type="button" class="unit-btn is-active" data-unit="metric" aria-pressed="true">°C</button>
        <button type="button" class="unit-btn" data-unit="imperial" aria-pressed="false">°F</button>
      </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="weather" class="weather" hidden>
      <div class="current">
        <div class="place">
          <h1 id="place-name">—</h1>
          <p id="place-meta" class="muted"></p>
          <p id="local-time" class="muted"></p>
        </div>

        <div class="now">
          <div id="now-icon" class="now-icon" aria-hidden="true"></div>
          <div>
            <p class="temp"><span id="temp">--</span><span id="temp-unit" class="temp-unit">°C</span></p>
            <p id="condition" class="condition">—</p>
            <p class="muted">Feels like <span id="feels">--</span></p>
          </div>
        </div>
      </div>

      <dl class="stats">
        <div class="stat">
          <dt>Humidity</dt>
          <dd><span id="humidity">--</span><small>%</small></dd>
        </div>
        <div class="stat">
          <dt>Wind speed</dt>
          <dd><span id="wind">--</span><small id="wind-unit"> km/h</small></dd>
          <dd class="stat-sub" id="wind-dir"></dd>
        </div>
        <div class="stat">
          <dt>Today</dt>
          <dd><span id="today-high">--</span><small> / </small><span id="today-low">--</span></dd>
          <dd class="stat-sub">High / Low</dd>
        </div>
      </dl>

      <section aria-labelledby="forecast-title">
        <h2 id="forecast-title" class="section-title">5-day forecast</h2>
        <ul id="forecast" class="forecast"></ul>
      </section>
    </section>

    <footer class="foot">
      Data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
